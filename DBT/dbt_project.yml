name: airline_analytics
version: "1.0.0"
config-version: 2

profile: airline_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  airline_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +schema: marts
      core:
        +materialized: table
      analytics:
        +materialized: incremental
        +incremental_strategy: delete+insert
        +on_schema_change: append_new_columns